<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Koto Badminton</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1220;
      color: #f4f6fb;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 1.6rem; margin: 0; }
    p { margin: 0; opacity: 0.75; max-width: 22rem; line-height: 1.5; }
    .badge { font-size: 3.5rem; line-height: 1; }
    a.button {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 999px;
      background: #4f8cff;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
    }
    a.button:active { transform: scale(0.97); }
    small { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="badge">🏸</div>
  <h1>Book Koto Badminton</h1>
  <p>Redirecting you to the reservation page. If it doesn't open
     automatically, tap the button below.</p>
  <a class="button" id="book" href="#">Book Now</a>
  <small>Koto badminton · hacomono reservation</small>

  <script>
    // The Koto badminton booking page. Update here if the link ever changes.
    const BOOKING_URL = "https://koto-hsc.hacomono.jp/reserve/space/MYQQRVYL";

    document.getElementById("book").href = BOOKING_URL;
    // Auto-redirect shortly after load so the button is visible as a fallback.
    setTimeout(function () { window.location.href = BOOKING_URL; }, 600);
  </script>
</body>
</html>
